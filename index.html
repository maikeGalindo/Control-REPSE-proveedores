*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{font-size:20px;display:block}.kpi span{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.edit{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.p>button{all:unset;display:block;width:100%;box-sizing:border-box;padding:12px;cursor:pointer}
.p>button:focus-visible,.chip:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600}.meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.Vigente{background:var(--okb);color:var(--ok)}.Recordatorio{background:var(--warnb);color:var(--warn)}.Vencido{background:var(--badb);color:var(--bad)}.nd{background:var(--line);color:var(--mute)}
.pr{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px}.pr .bar{flex:1;margin:0}
.det{padding:0 12px 14px;border-top:1px solid var(--line);font-size:14px}
.det h3{font-size:13px;margin:14px 0 6px}.det p{margin:4px 0;overflow-wrap:anywhere}.det a{color:var(--ac)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.m{border-radius:6px;padding:4px 0;text-align:center;font-size:11.5px;background:var(--line);color:var(--mute)}
.m.OK{background:var(--okb);color:var(--ok)}.m.NO{background:var(--badb);color:var(--bad)}.m small{display:block;font-size:10px;opacity:.8}
.pd{margin:6px 0}.pd b{font-size:13px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.t{font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:2px 8px;background:none;font-family:inherit}
.t.done{border-color:var(--ok);color:var(--ok);text-decoration:line-through;opacity:.7}
button.t{cursor:pointer}.empty{text-align:center;color:var(--mute);padding:30px 0}
.reset{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}

const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let D=[],note='';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':Math.round(v*100)+'%';
function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';r.push(row);row=[]}else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}
 const h=(r.shift()||[]).map(x=>x.trim().toLowerCase());
 return r.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}
const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return csv(await r.text())};
const num=s=>{if(!s)return null;const t=String(s).replace(',','.'),v=parseFloat(t);return isNaN(v)?null:(/%/.test(t)||v>1?v/100:v)};
const iso=s=>{if(!s)return null;let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null};
function build(P,Q,Mo){const by={};
 const ZM={'ZONA NORTE':'Norte','ZONA CENTRO':'Centro','SAN LUIS POTOSI':'SLP','CANCUN/ MERIDA':'Cancún/Mérida'};
 const L=P.filter(r=>r.id&&r.proveedor).map(r=>by[r.id]={id:r.id,z:ZM[(r.zona||'').toUpperCase()]||r.zona||'—',n:r.proveedor,v:iso(r.vigencia_repse),l:num(r.cumplimiento),sr:/^s/i.test(r.sin_respuesta),fa:Array(12).fill(0),mo:Array(12).fill(''),p:[]});
 Q.forEach(r=>{const p=by[r.id];if(p&&r.documento&&/^pend/i.test(r.estatus))p.p.push({d:r.documento,m:/^[úu]nico/i.test(r.mes)?-1:MS.indexOf(r.mes),done:false})});
 Mo.forEach(r=>{const p=by[r.id];if(!p)return;MS.forEach((m,i)=>{const k=m.toLowerCase();p.fa[i]=/^s/i.test(r['fact_'+k]||'')?1:0;p.mo[i]=(r['docs_'+k]||'').toUpperCase()})});
 return L}
const today=new Date(new Date().toDateString());
const status=p=>{if(!p.v)return'';const v=new Date(p.v+'T00:00');return v<today?'Vencido':v>new Date(+today+90*864e5)?'Vigente':'Recordatorio'};
const open_=p=>p.p.filter(x=>!x.done);
let F={s:'',z:'',q:'',op:null};
const chips=[['','Todos'],['Vencido','Vencidos'],['Recordatorio','Por vencer'],['pend','Con pendientes'],['sr','Sin respuesta']];
function card(p){
 const s=status(p),n=open_(p).length;let det='';
 if(F.op===String(p.id)){const by={};p.p.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
  det=`<div class="det"><h3>Ficha</h3><p><b>Zona:</b> ${esc(p.z)} &nbsp; <b>Vigencia REPSE:</b> ${p.v?p.v.split('-').reverse().join('/'):'—'}</p><p><b>Cumplimiento:</b> ${pct(p.l)}</p>
  <h3>Documentación mensual (según facturación)</h3><div class="months">${MS.map((m,i)=>`<div class="m ${p.mo[i]}">${m}<small>${p.fa[i]?'facturó':'sin fact.'}</small></div>`).join('')}</div>
  <h3>Pendientes (${n})</h3>${p.p.length?Object.entries(by).map(([d,xs])=>`<div class="pd"><b>${esc(d)}</b><div class="tags">${xs.map(x=>`<span class="t ${x.done?'done':''}">${x.m<0?'Único':MS[x.m]}</span>`).join('')}</div></div>`).join(''):'<p>Sin pendientes registrados.</p>'}</div>`}
 return `<div class="p"><button data-id="${esc(p.id)}" aria-expanded="${F.op===String(p.id)}"><div class="top"><div><div class="nm">${esc(p.n)}</div><div class="meta">${esc(p.z)}${p.sr?' · Sin respuesta':''}</div></div><span class="pill ${s||'nd'}">${s||'Sin vigencia'}</span></div>
 <div class="pr"><div class="bar"><i style="width:${(p.l||0)*100}%"></i></div><span>${pct(p.l)} cumpl.</span><span>${n} pend.</span></div></button>${det}</div>`}
function draw(){const q=F.q.toLowerCase();
 const L=D.filter(p=>(!F.z||p.z===F.z)&&(!q||p.n.toLowerCase().includes(q))&&(F.s===''||(F.s==='pend'?open_(p).length>0:F.s==='sr'?p.sr:status(p)===F.s)));
 L.sort((a,b)=>(a.l??2)-(b.l??2));
 $('list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">Ningún proveedor coincide con estos filtros.</div>';
 $('chips').innerHTML=chips.map(c=>`<button class="chip" data-k="${c[0]}" aria-pressed="${F.s===c[0]}">${c[1]}</button>`).join('')}
function init(){
 const avg=a=>{const v=a.filter(x=>x.l!=null);return v.length?v.reduce((s,x)=>s+x.l,0)/v.length:null};
 const zc={};D.forEach(p=>{if(p.z!=='—')zc[p.z]=(zc[p.z]||0)+1});
 const top=Object.keys(zc).sort((a,b)=>zc[b]-zc[a]).slice(0,3);
 $('kpis').innerHTML=[['General',avg(D)],...top.map(z=>[z,avg(D.filter(p=>p.z===z))])].map(k=>`<div class="kpi"><b>${pct(k[1])}</b><span>${esc(k[0])}</span><div class="bar"><i style="width:${(k[1]||0)*100}%"></i></div></div>`).join('');
 $('z').innerHTML='<option value="">Todas las zonas</option>'+[...new Set(D.map(p=>p.z))].sort().map(z=>`<option>${esc(z)}</option>`).join('');
 $('foot').textContent=note;draw()}
$('q').oninput=e=>{F.q=e.target.value;draw()};$('z').onchange=e=>{F.z=e.target.value;draw()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){F.s=b.dataset.k;draw()}};
$('list').onclick=e=>{const b=e.target.closest('.p>button');if(b){const id=b.dataset.id;F.op=F.op===id?null:id;draw()}};
(async()=>{
 if(CFG.prov&&CFG.pend&&CFG.meses){try{const[a,b,c]=await Promise.all([get(CFG.prov),get(CFG.pend),get(CFG.meses)]);D=build(a,b,c);
  note='Datos en vivo desde Google Sheets · consultado '+new Date().toLocaleString('es-MX')+'. Los cambios en la hoja pueden tardar unos minutos en reflejarse.'}catch(e){note='No se pudo leer la hoja; se muestra el último corte ('+ASOF+').'}}
 else note='Vista de ejemplo con datos del corte '+ASOF+'. Aún no está conectada a la hoja de Google.';
 if(!D.length)D=SNAP;init()})();
</script></body></html>
