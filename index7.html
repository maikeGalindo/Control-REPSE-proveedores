<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control REPSE · Proveedores</title>
<style>
:root{--bg:#ffffff;color-scheme:light;--card:#fff;--ink:#14213d;--mute:#5a6783;--line:#d9e0ec;--ac:#1b3a8f;--gr:#5fa83a;--ok:#1f8a4c;--warn:#b7791f;--bad:#c2372f;--okb:#e1f3e8;--warnb:#fbefd5;--badb:#fbe3e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182030;--ink:#e8edf7;--mute:#9aa7c0;--line:#2b3850;--ac:#8fa9f0;--gr:#8cc65a;--ok:#5fcf8c;--warn:#e6b450;--bad:#f0746c;--okb:#173324;--warnb:#3a2f14;--badb:#3d1c1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em;color:var(--ac)}.brand{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.brand img{border-radius:10px;background:#fff;padding:3px;border:1px solid var(--line);flex:none}.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{box-shadow:0 1px 3px rgba(20,33,61,.08);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gr);border-radius:10px;padding:10px}
.kpi b{font-size:20px;display:block}.kpi span{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gr)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.edit{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.p{box-shadow:0 1px 3px rgba(20,33,61,.08);background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.p>button{all:unset;display:block;width:100%;box-sizing:border-box;padding:12px;cursor:pointer}
.p>button:focus-visible,.chip:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600}.meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.Vigente{background:var(--okb);color:var(--ok)}.Recordatorio{background:var(--warnb);color:var(--warn)}.Vencido{background:var(--badb);color:var(--bad)}.nd{background:var(--line);color:var(--mute)}
.pr{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px}.pr .bar{flex:1;margin:0}
.det{padding:0 12px 14px;border-top:1px solid var(--line);font-size:14px}
.det h3{font-size:13px;margin:14px 0 6px}.det p{margin:4px 0;overflow-wrap:anywhere}.det a{color:var(--ac)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.m{border-radius:6px;padding:4px 0;text-align:center;font-size:11.5px;background:var(--line);color:var(--mute)}
.m.OK{background:var(--okb);color:var(--ok)}.m.NO{background:var(--badb);color:var(--bad)}.m small{display:block;font-size:10px;opacity:.8}
.pd{margin:6px 0}.pd b{font-size:13px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.t{font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:2px 8px;background:none;font-family:inherit}
.t.done{border-color:var(--ok);color:var(--ok);text-decoration:line-through;opacity:.7}
button.t{cursor:pointer}.empty{text-align:center;color:var(--mute);padding:30px 0}
.reset{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.opt{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}.pdfb{margin-left:auto;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
#report{display:none}
.rp-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gr);padding-bottom:8px;margin-bottom:10px}
.rp-head img{width:48px;height:48px}.rp-head h2{margin:0;font-size:17px;color:var(--ac)}.rp-head p{margin:2px 0 0;font-size:11px;color:var(--mute)}
.rp-k{display:flex;gap:6px;margin:8px 0 12px}.rp-k div{flex:1;border:1px solid var(--line);border-top:3px solid var(--gr);border-radius:6px;padding:6px 8px}.rp-k b{font-size:15px;display:block}.rp-k span{font-size:10px;color:var(--mute)}
#report table{width:100%;border-collapse:collapse;font-size:10.5px}
#report th{background:var(--ac);color:#fff;text-align:left;padding:5px 6px}
#report td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#report .rp-by{margin-top:14px;text-align:right;font-size:10px;color:var(--mute)}#report thead{display:table-header-group}#report tr{break-inside:avoid}
#report .pdet td{font-size:9.5px;color:var(--mute);padding-top:0}
@media print{@page{margin:12mm}body{background:#fff;font-size:11px}main{display:none!important}#report{display:block}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

const pct=v=>v==null?'—':Math.round(v*100)+'%';
function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';r.push(row);row=[]}else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}
 const h=(r.shift()||[]).map(x=>x.trim().toLowerCase());
 return r.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}

function build(P,Q,Mo){const by={};
 const ZM={'ZONA NORTE':'Norte','ZONA CENTRO':'Centro','SAN LUIS POTOSI':'SLP','CANCUN/ MERIDA':'Cancún/Mérida'};

 const L=P.filter(r=>r.id&&r.proveedor).map(r=>by[K(r)]={id:r.id,k:K(r),y:Y(r),z:ZM[(r.zona||'').toUpperCase()]||r.zona||'—',n:r.proveedor,v:iso(r.vigencia_repse),l:num(r.cumplimiento),sr:/^s/i.test(r.sin_respuesta),fa:Array(12).fill(0),mo:Array(12).fill(''),p:[]});
 Q.forEach(r=>{const p=by[K(r)];if(p&&r.documento&&/^pend/i.test(r.estatus))p.p.push({d:r.documento,m:/^[úu]nico/i.test(r.mes)?-1:MS.indexOf(r.mes),done:false})});

const today=new Date(new Date().toDateString());
const status=p=>{if(!p.v)return'';const v=new Date(p.v+'T00:00');return v<today?'Vencido':v>new Date(+today+90*864e5)?'Vigente':'Recordatorio'};

  <h3>Documentación mensual (según facturación)</h3><div class="months">${MS.map((m,i)=>`<div class="m ${p.mo[i]}">${m}<small>${p.fa[i]?'facturó':'sin fact.'}</small></div>`).join('')}</div>
  <h3>Pendientes (${n})</h3>${p.p.length?Object.entries(by).map(([d,xs])=>`<div class="pd"><b>${esc(d)}</b><div class="tags">${xs.map(x=>`<span class="t ${x.done?'done':''}">${x.m<0?'Único':MS[x.m]}</span>`).join('')}</div></div>`).join(''):'<p>Sin pendientes registrados.</p>'}</div>`}
 return `<div class="p"><button data-id="${esc(p.k)}" aria-expanded="${F.op===String(p.k)}"><div class="top"><div><div class="nm">${esc(p.n)}</div><div class="meta">${esc(p.z)}${p.sr?' · Sin respuesta':''}</div></div><span class="pill ${s||'nd'}">${s||'Sin vigencia'}</span></div>
 <div class="pr"><div class="bar"><i style="width:${(p.l||0)*100}%"></i></div><span>${pct(p.l)} cumpl.</span><span>${n} pend.</span></div></button>${det}</div>`}
function draw(){const q=F.q.toLowerCase();
 const L=D.filter(p=>p.y===F.y&&(!F.z||p.z===F.z)&&(!q||p.n.toLowerCase().includes(q)));
 L.sort((a,b)=>(b.l??-1)-(a.l??-1)||a.n.localeCompare(b.n,'es'));CUR=L;
 $('list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">Ningún proveedor coincide con estos filtros.</div>';}
const avg=a=>{const v=a.filter(x=>x.l!=null);return v.length?v.reduce((s,x)=>s+x.l,0)/v.length:null};
function setYear(){
 const DY=D.filter(p=>p.y===F.y),zc={};DY.forEach(p=>{if(p.z!=='—')zc[p.z]=(zc[p.z]||0)+1});
 const top=Object.keys(zc).sort((a,b)=>zc[b]-zc[a]).slice(0,3);
 $('kpis').innerHTML=[['General',avg(DY)],...top.map(z=>[z,avg(DY.filter(p=>p.z===z))])].map(k=>`<div class="kpi"><b>${pct(k[1])}</b><span>${esc(k[0])}</span><div class="bar"><i style="width:${(k[1]||0)*100}%"></i></div></div>`).join('');
 $('z').innerHTML='<option value="">Todas las zonas</option>'+[...new Set(DY.map(p=>p.z))].sort().map(z=>`<option>${esc(z)}</option>`).join('');
 F.z='';F.op=null;draw()}
function init(){
 const ys=[...new Set(D.map(p=>p.y))].sort();F.y=ys.length?ys[ys.length-1]:DEF;
 $('y').innerHTML=(ys.length?ys:[DEF]).map(y=>`<option value="${esc(y)}"${y===F.y?' selected':''}>Ejercicio fiscal ${esc(y)}</option>`).join('');
 $('foot').textContent=note;setYear()}
function report(){
 const L=CUR,det=$('det').checked,dt=new Date(),f2=n=>String(n).padStart(2,'0');
 const fecha=`${f2(dt.getDate())}/${f2(dt.getMonth()+1)}/${dt.getFullYear()} ${f2(dt.getHours())}:${f2(dt.getMinutes())}`;
 const st=L.map(status),ven=st.filter(x=>x==='Vencido').length,rec=st.filter(x=>x==='Recordatorio').length;
 const np=L.map(p=>open_(p).length),tot=np.reduce((a,b)=>a+b,0),cp=np.filter(x=>x>0).length;
 const fl=[F.z?'Zona: '+F.z:'Todas las zonas',F.q?'Búsqueda: "'+F.q+'"':''].filter(Boolean).join(' · ');
 const fmt=v=>v?v.split('-').reverse().join('/'):'—';
 const rows=L.map((p,i)=>{const s=status(p),o=open_(p);let r=`<tr><td>${i+1}</td><td><b>${esc(p.n)}</b></td><td>${esc(p.z)}${p.sr?' (sin respuesta)':''}</td><td>${fmt(p.v)}</td><td><span class="pill ${s||'nd'}">${s||'Sin vigencia'}</span></td><td>${pct(p.l)}</td><td>${o.length}</td></tr>`;
  if(det&&o.length){const by={};o.forEach(x=>(by[x.d]=by[x.d]||[]).push(x.m<0?'Único':MS[x.m]));r+=`<tr class="pdet"><td></td><td colspan="6">Pendientes: ${Object.entries(by).map(([d,m])=>esc(d)+' ('+m.join(', ')+')').join(' · ')}</td></tr>`}
  return r}).join('');
 $('report').innerHTML=`<div class="rp-head"><img src="${document.querySelector('.brand img').src}" alt=""><div><h2>Reporte de cumplimiento REPSE · Ejercicio fiscal ${esc(F.y)}</h2><p>Generado el ${fecha} · ${esc(fl)}</p></div></div>
 <div class="rp-k"><div><b>${L.length}</b><span>Proveedores</span></div><div><b>${pct(avg(L))}</b><span>Cumplimiento promedio</span></div><div><b>${ven}</b><span>REPSE vencidos</span></div><div><b>${rec}</b><span>Por vencer (90 días)</span></div><div><b>${cp}</b><span>Con pendientes</span></div><div><b>${tot}</b><span>Documentos pendientes</span></div></div>
 <table><thead><tr><th>#</th><th>Proveedor</th><th>Zona</th><th>Vigencia REPSE</th><th>Estatus</th><th>Cumpl.</th><th>Pend.</th></tr></thead><tbody>${rows}</tbody></table><p class="rp-by">Powered by C.P. Miguel Angel Galindo · Jefatura REPSE</p>`}
$('q').oninput=e=>{F.q=e.target.value;draw()};$('y').onchange=e=>{F.y=e.target.value;setYear()};$('z').onchange=e=>{F.z=e.target.value;draw()};
$('list').onclick=e=>{const b=e.target.closest('.p>button');if(b){const id=b.dataset.id;F.op=F.op===id?null:id;draw()}};
const t0=document.title;
$('pdf').onclick=()=>{if(!CUR.length)return;report();document.title='Reporte REPSE '+F.y;window.print()};
window.onafterprint=()=>{document.title=t0};
(async()=>{
 if(CFG.prov&&CFG.pend&&CFG.meses){try{const nm=['Proveedores','Pendientes','Meses'],rs=await Promise.allSettled([get(CFG.prov),get(CFG.pend),get(CFG.meses)]);const bad=rs.map((r,i)=>r.status==='rejected'?nm[i]+': '+((r.reason&&r.reason.message)||'error'):null).filter(Boolean);if(bad.length)throw new Error(bad.join(' | '));const T=rs.map(r=>r.value),kd=t=>{const k=Object.keys(t[0]||{});return k.includes('documento')?1:k.includes('fact_ene')?2:(k.includes('zona')||k.includes('vigencia_repse'))?0:-1},ks=T.map(kd),ok=[...ks].sort().join()==='0,1,2',a=ok?T[ks.indexOf(0)]:T[0],b=ok?T[ks.indexOf(1)]:T[1],c=ok?T[ks.indexOf(2)]:T[2];D=build(a,b,c);if(!D.length)throw new Error('Proveedores no tiene filas con id y proveedor. Filas leídas: '+a.length+'. Columnas: '+Object.keys(a[0]||{}).join(', '));
  note='Datos en vivo desde Google Sheets · consultado '+new Date().toLocaleString('es-MX')+' · filas leídas: Proveedores '+a.length+', Pendientes '+b.length+', Meses '+c.length+'. Los cambios en la hoja pueden tardar unos minutos en reflejarse.'}catch(e){err=e.message;note='No se pudo leer la hoja de Google ('+err+').'}}
 else note='Sin conexión a la hoja de Google.';
 init();if(!D.length)$('list').innerHTML='<div class="empty">No se pudieron cargar los datos desde Google Sheets.<br><small>'+esc(err)+'</small></div>'})();
</script></body></html>
